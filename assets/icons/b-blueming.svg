<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Blueming Menu — 안 B: 중심에서 피어나는 타일</title>
  <defs>
    <!-- 중심이 밝고 바깥이 깊다. 빛이 가운데서 퍼져 나가는 인상. -->
    <radialGradient id="bGlow" gradientUnits="userSpaceOnUse" cx="128" cy="128" r="120">
      <stop offset="0"    stop-color="#8AD8FF"/>
      <stop offset="0.45" stop-color="#38BDF8"/>
      <stop offset="1"    stop-color="#1A56DB"/>
    </radialGradient>

    <!--
      꽃잎 한 장 = 안쪽 모서리만 뾰족한 라운드 사각형.
      중심을 향한 좌하단 코너의 반지름만 8, 나머지 세 코너는 32.
      이 비대칭이 "중심에서 벌어진다"는 인상을 만든다.
    -->
    <path id="bPetal"
          d="M 138 64
             A 32 32 0 0 1 170 32
             L 192 32
             A 32 32 0 0 1 224 64
             L 224 86
             A 32 32 0 0 1 192 118
             L 146 118
             A 8 8 0 0 1 138 110
             Z"/>
  </defs>

  <g fill="url(#bGlow)">
    <use href="#bPetal"/>
    <use href="#bPetal" transform="rotate(90 128 128)"/>
    <use href="#bPetal" transform="rotate(180 128 128)"/>
    <use href="#bPetal" transform="rotate(270 128 128)"/>
  </g>
</svg>
